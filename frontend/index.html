<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#227649" />
    <meta name="description" content="AgroSmart helps farmers with crop guidance, live mandi prices, weather forecasting, and an AI farming assistant, all in one platform." />
    <title>AgroSmart - Smart Farming Platform</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="AgroSmart - Smart Farming Platform" />
    <meta property="og:description" content="Crop guidance, live mandi prices, weather forecasting and an AI assistant built for farmers." />
    <meta property="og:image" content="/favicon.svg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AgroSmart - Smart Farming Platform" />
    <meta name="twitter:description" content="Crop guidance, live mandi prices, weather forecasting and an AI assistant built for farmers." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (function () {
        var stored = localStorage.getItem("agrosmart_theme")
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
